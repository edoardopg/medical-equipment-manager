<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar contraseña — Medical Equipment Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .links {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
        }

        a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .error {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            border-left: 4px solid #c33;
            display: none;
        }

        .success {
            background-color: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            border-left: 4px solid #3c3;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nueva contraseña</h1>
        <p class="subtitle">Ingresa tu nueva contraseña</p>
        
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm">Confirmar contraseña</label>
                <input type="password" id="confirm" name="confirm" required>
            </div>

            <button type="submit">Actualizar contraseña</button>
        </form>

        <div class="links">
            <a href="login.html">Volver a login</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        console.log("Token extraído:", token); 

        if (!token) {
            document.getElementById("error").textContent = "Token inválido. Solicita un nuevo enlace.";
            document.getElementById("error").style.display = "block";
            document.getElementById("resetForm").style.display = "none";
        }

        document.getElementById("resetForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const errorDiv = document.getElementById("error");
            const successDiv = document.getElementById("success");
            
            errorDiv.style.display = "none";
            successDiv.style.display = "none";

            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm").value;

            if (password !== confirm) {
                errorDiv.textContent = "Las contraseñas no coinciden";
                errorDiv.style.display = "block";
                return;
            }

            try {
                const response = await fetch("/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ 
                        token: token,
                        new_password: password 
                    })
                });

                const data = await response.json();

                if (response.ok && data.message) {
                    successDiv.textContent = "Contraseña actualizada. Redirigiendo...";
                    successDiv.style.display = "block";
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    errorDiv.textContent = data.error || "Error al actualizar la contraseña";
                    errorDiv.style.display = "block";
                }
            } catch (error) {
                errorDiv.textContent = "Error de conexión. Intenta de nuevo.";
                errorDiv.style.display = "block";
            }
        });
    </script>
</body>
</html>
